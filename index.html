<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lead Source Worksheet</title>
<style>
:root{--ground:#EDF0EF;--surface:#FFFFFF;--ink:#14201C;--muted:#5B6964;--rule:#AEB9B4;--accent:#0E5A74;--accent-ink:#FFFFFF;--bad:#B24E17}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--ground:#0F1614;--surface:#172220;--ink:#E4EBE8;--muted:#97A7A1;--rule:#3A4A45;--accent:#62B5D1;--accent-ink:#06222C;--bad:#F08C4E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding:24px 16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:26px 24px}
h1{font:600 22px/1.2 Georgia,'Times New Roman',serif;margin:0 0 4px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
input[type=password]{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--rule);border-radius:5px;background:var(--surface);color:var(--ink)}
.remember{display:flex;gap:7px;align-items:center;font-weight:400;color:var(--muted);margin:12px 0 16px}
button{width:100%;font:600 15px/1 inherit;padding:11px;border:0;border-radius:5px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-size:13.5px;min-height:1.4em;margin:10px 0 0}
</style>
</head>
<body>
<form id="gate">
  <h1>Lead Source Worksheet</h1>
  <p>McWilliams|Ballard marketing. Enter the password you were sent.</p>
  <label for="pw">Password</label>
  <input type="password" id="pw" autocomplete="current-password" required autofocus>
  <label class="remember"><input type="checkbox" id="remember" checked> Remember on this device</label>
  <button type="submit" id="go">Open</button>
  <div class="err" id="err" role="alert"></div>
</form>

const te = new TextEncoder(), td = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const unb64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const KEY = 'lsw-gate-' + PAYLOAD.v;

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function openPage(key, token) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  const html = td.decode(plain).replace('/*TOKEN*/null', JSON.stringify(token));
  document.open(); document.write(html); document.close();
}
async function tokenFor(pw) { return hex(await crypto.subtle.digest('SHA-256', te.encode('lsw-api:' + pw))); }

(async () => {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) {
      const key = await crypto.subtle.importKey('raw', b64(saved.k), 'AES-GCM', true, ['decrypt']);
      await openPage(key, saved.t);
    }
  } catch { try { localStorage.removeItem(KEY); } catch {} }
})();

document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const key = await deriveKey(pw), token = await tokenFor(pw);
    try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct)); }
    catch { throw new Error('bad'); }
    if (document.getElementById('remember').checked) {
      try { localStorage.setItem(KEY, JSON.stringify({ k: unb64(await crypto.subtle.exportKey('raw', key)), t: token })); } catch {}
    }
    await openPage(key, token);
  } catch {
    err.textContent = 'That password didn’t work. Check it and try again.';
    btn.disabled = false;
    document.getElementById('pw').select();
  }
});
</script>
